[package]
name = "cpr-account-dialogue"
version = "0.4.2"
edition = "2024"
license = "Apache-2.0"
[dependencies]
gateway-plugin-sdk = { path = "../vendor/gateway-plugin-sdk", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "io-util", "rt", "macros", "sync", "time"] }
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
